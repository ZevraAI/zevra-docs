site_name: Zevra Documentation
site_description: Official documentation for the Zevra AI Platform
site_author: Zevra
site_url: https://docs.zevra.ai

repo_name: zevra-docs
repo_url: https://github.com/ZevraAI/zevra-docs
edit_uri: edit/main/docs/

docs_dir: docs

# Fail loudly on broken structure. Combined with `mkdocs build --strict`
# in CI, these turn every broken link or orphaned page into a build failure.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

theme:
  name: material
  custom_dir: overrides

  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    # Navigation
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.expand

    # Table of Contents
    - toc.follow

    # Search
    - search.suggest
    - search.highlight

    # Content
    - content.code.copy
    - content.tabs.link
    - content.tooltips

plugins:
  - search

  # Navigation is assembled from per-directory .pages files —
  # see "Navigation" in STYLE_GUIDE.md.
  - awesome-pages

  - mermaid2

  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true

  - minify:
      minify_html: true

markdown_extensions:
  - admonition

  - attr_list

  - md_in_html

  - tables

  - toc:
      permalink: true

  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.keys

  - pymdownx.mark

  - pymdownx.critic

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

extra:
  version:
    provider: mike

copyright: Copyright © 2026 Zevra. All rights reserved.

# Navigation is deliberately NOT defined here.
#
# A single central nav does not scale: every new page would require an edit
# to this file, and section owners could not manage their own ordering.
# Instead, the awesome-pages plugin assembles navigation from per-directory
# `.pages` files:
#
#   docs/.pages            — top-level section order
#   docs/<section>/.pages  — section title and page order within the section
#
# See "Navigation" in STYLE_GUIDE.md for the rules.